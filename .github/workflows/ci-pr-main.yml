name: PR CI (monorepo Maven)

on:
  # Trigger this workflow for pull requests targeting main
  pull_request:
    branches: [ "main" ]
    # Run when PR is opened, updated with new commits, reopened,
    # or moved from draft to "ready for review"
    types: [opened, synchronize, reopened, ready_for_review]

# Minimal permissions for CI read-only operations
permissions:
  contents: read

jobs:
  build-test:
    name: Build and test ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      # Continue running other modules even if one fails, for better feedback
      fail-fast: false
      matrix:
        # All modules in build order (dependency order)
        module:
          - dungeon-walker-contracts
          - dungeon-walker-commons
          - dungeon-walker-commons-spring
          - dungeon-walker-config-server
          - dungeon-walker-discovery-server
          - dungeon-walker-engine
          - dungeon-walker-ws-server
          - dungeon-walker-history
          - dungeon-walker-gateway-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          # Enables built-in Maven dependency cache for faster runs
          cache: maven

      - name: Docker sanity check
        run: |
          # Testcontainers relies on Docker daemon availability
          docker version
          docker info

      - name: Build + Test ${{ matrix.module }} (and required dependencies)
        env:
          # Optional compatibility setting for some CI/Testcontainers environments.
          # Remove if your setup works reliably without it.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          # -pl selects the target module from the matrix
          # -am also builds modules required by that target
          # clean verify compiles, runs tests, and verifies package quality gates
          mvn -B -ntp -pl "${{ matrix.module }}" -am clean verify
