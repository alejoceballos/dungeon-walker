name: PR CI (monorepo Maven)

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module:
          - dungeon-walker-contracts
          - dungeon-walker-commons
          - dungeon-walker-commons-spring
          - dungeon-walker-config-server
          - dungeon-walker-discovery-server
          - dungeon-walker-engine
          - dungeon-walker-ws-server
          - dungeon-walker-history
          - dungeon-walker-gateway-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Docker sanity check
        run: |
          docker version
          docker info

      - name: Build + Test ${{ matrix.module }}
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          cd ${{ matrix.module }}
          mvn -B -ntp clean verify
