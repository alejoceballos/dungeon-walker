name: PR CI (monorepo Maven)

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # Detect which module groups were touched by this PR so downstream
  # jobs can skip entirely when their modules are unaffected.
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    outputs:
      foundation: ${{ steps.filter.outputs.foundation }}
      infrastructure: ${{ steps.filter.outputs.infrastructure }}
      aggregators: ${{ steps.filter.outputs.aggregators }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            foundation:
              - 'dungeon-walker-contracts/**'
              - 'dungeon-walker-commons/**'
              - 'dungeon-walker-commons-spring/**'
            infrastructure:
              - 'dungeon-walker-config-server/**'
              - 'dungeon-walker-discovery-server/**'
              - 'dungeon-walker-gateway-server/**'
            aggregators:
              - 'dungeon-walker-engine/**'
              - 'dungeon-walker-ws-server/**'
              - 'dungeon-walker-history/**'

  # Foundation libraries - build first, in parallel
  build-foundation:
    name: Build ${{ matrix.module }}
    needs: changes
    if: needs.changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - dungeon-walker-contracts
          - dungeon-walker-commons
          - dungeon-walker-commons-spring

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build + Test ${{ matrix.module }}
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          cd ${{ matrix.module }}
          mvn -B -ntp clean verify install

      - name: Cache Maven repository
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-${{ matrix.module }}-${{ hashFiles(format('{0}/**', matrix.module)) }}

  # Infrastructure services
  build-infrastructure:
    name: Build ${{ matrix.module }}
    needs: [changes, build-foundation]
    # `!failure() && !cancelled()` keeps this job from being auto-skipped
    # just because build-foundation itself was skipped (no foundation changes).
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.infrastructure == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - dungeon-walker-config-server
          - dungeon-walker-discovery-server
          - dungeon-walker-gateway-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build + Test ${{ matrix.module }}
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          cd ${{ matrix.module }}
          mvn -B -ntp clean verify install

      - name: Cache Maven repository
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-${{ matrix.module }}-${{ hashFiles(format('{0}/**', matrix.module)) }}

  # Aggregator projects
  build-aggregators:
    name: Build ${{ matrix.module }}
    needs: [changes, build-foundation, build-infrastructure]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.aggregators == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - dungeon-walker-engine
          - dungeon-walker-ws-server
          - dungeon-walker-history

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Restore Maven repository - dungeon-walker-contracts
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-dungeon-walker-contracts-${{ hashFiles('dungeon-walker-contracts/**') }}

      - name: Restore Maven repository - dungeon-walker-commons
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-dungeon-walker-commons-${{ hashFiles('dungeon-walker-commons/**') }}

      - name: Restore Maven repository - dungeon-walker-commons-spring
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-dungeon-walker-commons-spring-${{ hashFiles('dungeon-walker-commons-spring/**') }}

      - name: Build + Test ${{ matrix.module }}
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          cd ${{ matrix.module }}
          mvn -B -ntp clean verify install

      - name: SonarCloud Analysis
        if: ${{ !github.event.pull_request.draft }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd ${{ matrix.module }}
          mvn -B -ntp sonar:sonar \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.host.url=https://sonarcloud.io
