name: PR CI (monorepo Maven)

on:
  # Trigger this workflow for pull requests targeting main
  pull_request:
    branches: [ "main" ]
    # Run when PR is opened, updated with new commits, reopened,
    # or moved from draft to "ready for review"
    types: [opened, synchronize, reopened, ready_for_review]

# Minimal permissions for CI read-only operations
permissions:
  contents: read

jobs:
  detect-modules:
    name: Detect changed Maven modules
    runs-on: ubuntu-latest
    outputs:
      # JSON array used as matrix input in the next job
      modules: ${{ steps.set-matrix.outputs.modules }}
      # Boolean-like string ("true"/"false") to decide if build job should run
      has_modules: ${{ steps.set-matrix.outputs.has_modules }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is needed for reliable PR diff computation
          fetch-depth: 0

      - name: Detect changed Maven modules
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          # List files changed between PR head and base branch
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Find all module directories that contain a pom.xml
          # Exclude root pom.xml because we want child modules for matrix entries
          mapfile -t ALL_MODULES < <(find . -name pom.xml -not -path "./pom.xml" -exec dirname {} \; | sed 's#^\./##' | sort -u)

          # Collect modules that were directly touched by changed files
          declare -A CHANGED_MODULES=()
          while IFS= read -r file; do
            for mod in "${ALL_MODULES[@]}"; do
              if [[ "$file" == "$mod/"* ]] || [[ "$file" == "$mod" ]]; then
                CHANGED_MODULES["$mod"]=1
              fi
            done
          done <<< "$CHANGED_FILES"

          # If shared/root build files changed, force all modules to run
          # because dependency/build behavior may have changed globally
          if echo "$CHANGED_FILES" | grep -Eq '^(pom.xml|\.mvn/|mvnw|mvnw.cmd|\.github/workflows/)'; then
            for mod in "${ALL_MODULES[@]}"; do
              CHANGED_MODULES["$mod"]=1
            done
          fi

          # Export outputs for downstream matrix job
          if [[ ${#CHANGED_MODULES[@]} -eq 0 ]]; then
            # No module-relevant changes detected
            echo 'modules=[]' >> "$GITHUB_OUTPUT"
            echo 'has_modules=false' >> "$GITHUB_OUTPUT"
          else
            # Convert module list to JSON array for matrix strategy
            JSON=$(printf '%s\n' "${!CHANGED_MODULES[@]}" | sort -u | jq -R . | jq -s -c .)
            echo "modules=$JSON" >> "$GITHUB_OUTPUT"
            echo 'has_modules=true' >> "$GITHUB_OUTPUT"
          fi

  build-test:
    name: Build and test changed modules
    needs: detect-modules
    # Skip if:
    # - no modules were detected, or
    # - PR is still in draft state
    if: needs.detect-modules.outputs.has_modules == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    strategy:
      # Continue running other modules even if one fails, for better feedback
      fail-fast: false
      matrix:
        # Dynamic matrix generated by detect-modules job
        module: ${{ fromJson(needs.detect-modules.outputs.modules) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          # Enables built-in Maven dependency cache for faster runs
          cache: maven

      - name: Docker sanity check
        run: |
          # Testcontainers relies on Docker daemon availability
          docker version
          docker info

      - name: Build + Test selected module (and required dependencies)
        env:
          # Optional compatibility setting for some CI/Testcontainers environments.
          # Remove if your setup works reliably without it.
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          # -pl selects the target module from the matrix
          # -am also builds modules required by that target
          # clean verify compiles, runs tests, and verifies package quality gates
          mvn -B -ntp -pl "${{ matrix.module }}" -am clean verify
