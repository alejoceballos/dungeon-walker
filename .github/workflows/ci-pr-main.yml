name: PR CI (monorepo Maven)

on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # Foundation libraries - build first, in parallel
  build-foundation:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - dungeon-walker-contracts
          - dungeon-walker-commons
          - dungeon-walker-commons-spring

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build + Test ${{ matrix.module }}
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          cd ${{ matrix.module }}
          mvn -B -ntp clean verify install

      - name: Cache Maven repository
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-${{ github.run_id }}-${{ matrix.module }}

  # Infrastructure services
  build-infrastructure:
    name: Build ${{ matrix.module }}
    needs: build-foundation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - dungeon-walker-config-server
          - dungeon-walker-discovery-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Restore Maven repository from foundation builds
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-${{ github.run_id }}-dungeon-walker-contracts

      - name: Build + Test ${{ matrix.module }}
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          cd ${{ matrix.module }}
          mvn -B -ntp clean verify install

      - name: Cache Maven repository
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-${{ github.run_id }}-${{ matrix.module }}

  # Aggregator projects
  build-aggregators:
    name: Build ${{ matrix.module }}
    needs: [build-foundation, build-infrastructure]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - dungeon-walker-engine
          - dungeon-walker-ws-server
          - dungeon-walker-history

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Restore Maven repository from foundation
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-${{ github.run_id }}-dungeon-walker-contracts

      - name: Restore Maven repository from infrastructure
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-${{ github.run_id }}-dungeon-walker-config-server

      - name: Build + Test ${{ matrix.module }}
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          cd ${{ matrix.module }}
          mvn -B -ntp clean verify install

      - name: Cache Maven repository
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-${{ github.run_id }}-${{ matrix.module }}

  build-gateway:
    name: Build dungeon-walker-gateway-server
    needs: [build-foundation, build-infrastructure, build-aggregators]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Restore Maven repository
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-repo-${{ github.run_id }}-dungeon-walker-contracts

      - name: Docker sanity check
        run: |
          docker version
          docker info

      - name: Build + Test dungeon-walker-gateway-server
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          cd dungeon-walker-gateway-server
          mvn -B -ntp clean verify