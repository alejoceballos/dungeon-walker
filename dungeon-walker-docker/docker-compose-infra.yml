services:

  # - - - - KAFKA - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"     # Port for Kafka broker
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: true
      CLUSTER_ID: dungeon-walker-kafka-cluster

  # - - - - POSTGRES - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

  # After starting the container for the first time (with no volume), in the "dungeon-walker-docker" folder, run:
  # docker exec -i postgres-dungeon-db psql -U postgres -t < ddl-scripts/engine/create_pekko_tables_postgres.sql
  
  postgres-dungeon-db:
    image: postgres:18-alpine
    container_name: postgres-dungeon-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./ddl-scripts/engine:/docker-entrypoint-initdb.d

  # After starting the container for the first time (with no volume), in the "dungeon-walker-docker" folder, run:
  # docker exec -i postgres-history-db psql -U postgres -t < ddl-scripts/history/create_history_tables_postgres.sql

  postgres-history-db:
    image: postgres:18-alpine
    container_name: postgres-history-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./ddl-scripts/history:/docker-entrypoint-initdb.d

  # - - - - RABBITMQ - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  # - - - - KEYCLOAK - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -

  keycloak-auth-server:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: keycloak-auth-server
    command: ["start-dev", "--import-realm"]
    ports:
      - "8087:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
    volumes:
      - ./security/keycloak-realm-dungeon-walker-4-docker.json:/opt/keycloak/data/import/keycloak-realm-dungeon-walker.json